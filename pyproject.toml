[project]
name = "agent-tipping"
version = "0.0.1"
description = "Find the point of no return in LLM agent runs: the step where success or failure was decided."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Georgii" }]
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_tipping"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "httpx>=0.27",  # used by scripts/vllm_smoke.py
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: needs the local vLLM server (run with --run-gpu)",
]
